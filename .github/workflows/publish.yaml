name: Publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yaml'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yaml'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check
        run: make check

  publish-ghcr:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    environment:
      name: ghcr
      url: https://ghcr.io/zachspar/fred-mcp/fred-mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Released commit
        id: released
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/zachspar/fred-mcp/fred-mcp-server:latest
            ghcr.io/zachspar/fred-mcp/fred-mcp-server:${{ github.event.release.tag_name }}
            ghcr.io/zachspar/fred-mcp/fred-mcp-server:${{ steps.released.outputs.sha }}
          platforms: linux/amd64,linux/arm64

  publish-pypi:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/fred-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
